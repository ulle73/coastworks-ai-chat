name: coastworks-ai-chat
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: coastworks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
      POSTGRES_DB: coastworks
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coastworks -d coastworks"]
      interval: 5s
      retries: 10
  mail:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://coastworks:${POSTGRES_PASSWORD:-local-only}@db:5432/coastworks
    command: ["python", "-m", "app.db"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://coastworks:${POSTGRES_PASSWORD:-local-only}@db:5432/coastworks
      SMTP_HOST: mail
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://coastworks:${POSTGRES_PASSWORD:-local-only}@db:5432/coastworks
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
volumes:
  postgres:

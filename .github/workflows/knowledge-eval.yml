name: Knowledge quality eval
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: coastworks
          POSTGRES_PASSWORD: testing-only
          POSTGRES_DB: coastworks_eval_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U coastworks -d coastworks_eval_test" --health-interval 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://coastworks:testing-only@localhost:5432/coastworks_eval_test
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.10.12', python-version: '3.13'}
      - run: uv sync --frozen
      - run: uv run python -m evals.run --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-eval
          path: evals/results.json

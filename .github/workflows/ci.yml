name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: coastworks
          POSTGRES_PASSWORD: testing-only
          POSTGRES_DB: coastworks_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U coastworks -d coastworks_test" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://coastworks:testing-only@localhost:5432/coastworks_test
      ENVIRONMENT: test
      RUN_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.10.12', python-version: '3.13'}
      - run: uv sync --frozen
      - run: uv run ruff check --config pyproject.toml app tests
      - run: uv run python -m app.db
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm test
        working-directory: web

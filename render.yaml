services:
  - type: worker
    name: coastworks-ai-chat-worker
    runtime: python
    region: frankfurt
    plan: starter
    branch: main
    repo: https://github.com/ulle73/coastworks-ai-chat
    autoDeployTrigger: commit
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run python -m app.worker
    maxShutdownDelaySeconds: 180
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: ENVIRONMENT
        fromService:
          name: coastworks-ai-chat-api
          type: web
          envVarKey: ENVIRONMENT
      - key: APP_ORIGIN
        fromService:
          name: coastworks-ai-chat-api
          type: web
          envVarKey: APP_ORIGIN
      - key: PUBLIC_API_ORIGIN
        fromService:
          name: coastworks-ai-chat-api
          type: web
          envVarKey: PUBLIC_API_ORIGIN
      - key: SECRET_KEY
        fromService:
          name: coastworks-ai-chat-api
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromService:
          name: coastworks-ai-chat-api
          type: web
          envVarKey: DATABASE_URL
      - key: LLM_PROVIDER
        fromService:
          name: coastworks-ai-chat-api
          type: web
          envVarKey: LLM_PROVIDER
      - key: LLM_MODEL
        fromService:
          name: coastworks-ai-chat-api
          type: web
          envVarKey: LLM_MODEL
      - key: EMBEDDINGS_PROVIDER
        fromService:
          name: coastworks-ai-chat-api
          type: web
          envVarKey: EMBEDDINGS_PROVIDER
      - key: EMBEDDINGS_MODEL
        fromService:
          name: coastworks-ai-chat-api
          type: web
          envVarKey: EMBEDDINGS_MODEL
      - key: GEMINI_API_KEY
        fromService:
          name: coastworks-ai-chat-api
          type: web
          envVarKey: GEMINI_API_KEY
      - key: CLOUDFLARE_ACCOUNT_ID
        fromService:
          name: coastworks-ai-chat-api
          type: web
          envVarKey: CLOUDFLARE_ACCOUNT_ID
      - key: CLOUDFLARE_API_TOKEN
        fromService:
          name: coastworks-ai-chat-api
          type: web
          envVarKey: CLOUDFLARE_API_TOKEN

[project]
name = "coastworks-ai-chat"
version = "0.1.0"
description = "URL-first business assistants with verified knowledge publication"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "email-validator>=2.2,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.4,<1",
  "numpy>=2,<3",
  "aiohttp>=3.12,<4",
  "beautifulsoup4>=4.13,<5",
  "langchain-core>=1,<2",
  "langchain-text-splitters>=1,<2",
  "langchain-google-genai>=4,<5",
  "langchain-openai>=1,<2",
  "loguru>=0.7,<1",
  "itsdangerous>=2.2,<3",
  "aiosmtplib>=4,<6",
  "stripe>=15.4,<16",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
exclude = ["app/crawling/cloudflare.py", "app/providers/factory.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
